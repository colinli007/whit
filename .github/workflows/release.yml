# Pushing a `v*` tag builds the macOS .dmg for Apple silicon and Intel and
# attaches both to the GitHub Release of that tag (created if missing).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Whit $TAG" --generate-notes

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$TAG" = "v$version" || { echo "tag $TAG does not match Cargo.toml version $version"; exit 1; }

      # gpui compiles its Metal shaders at build time; Xcode 26 ships the
      # Metal Toolchain as a separate component.
      - name: Install the Metal Toolchain
        run: xcrun -sdk macosx metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Package
        run: cargo packager --release

      - name: Upload to the release
        run: gh release upload "$TAG" target/packager/*.dmg --clobber
